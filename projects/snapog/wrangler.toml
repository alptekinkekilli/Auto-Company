name = "snapog"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "snapog-db"
# Deploy step: `wrangler d1 create snapog-db` and paste the returned UUID here.
# Local dev works with any string (Miniflare uses a SQLite file).
database_id = "REPLACE_WITH_WRANGLER_D1_CREATE_OUTPUT"

[[r2_buckets]]
binding = "OG_CACHE"
bucket_name = "snapog-og-cache"

[vars]
ENVIRONMENT = "development"
# Set AUTH_SECRET via `wrangler secret put AUTH_SECRET` for dashboard cookie signing

# Cost-alerting cron. Runs every 6 hours (00, 06, 12, 18 UTC). Checks D1
# writes/day, cache hit rate, signups, active users, and R2 storage bytes;
# posts to ALERT_WEBHOOK_URL if any threshold trips.
#
# Optional secrets consumed by the scheduled handler (all no-op if unset):
#   wrangler secret put ALERT_WEBHOOK_URL              # Slack/Discord/generic
#   wrangler secret put CLOUDFLARE_ACCOUNT_ID          # for R2 GraphQL query
#   wrangler secret put CLOUDFLARE_ANALYTICS_API_TOKEN # Analytics:Read scope
[triggers]
crons = ["0 */6 * * *"]

[env.staging]
name = "snapog-staging"
[env.staging.vars]
ENVIRONMENT = "staging"

[env.production]
name = "snapog"
[env.production.vars]
ENVIRONMENT = "production"
