name: snapog-ci

on:
  pull_request:
    paths:
      - "projects/_archive/snapog/**"
      - "projects/_archive/ci/snapog-ci.yml"
  push:
    branches:
      - main
    paths:
      - "projects/_archive/snapog/**"
      - "projects/_archive/ci/snapog-ci.yml"

permissions:
  contents: read

concurrency:
  group: snapog-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/snapog
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: projects/snapog/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc --noEmit)
        run: npm run typecheck

      - name: Wrangler config sanity
        run: |
          set -euo pipefail
          if ! grep -q '^name = "snapog"' wrangler.toml; then
            echo "::error::wrangler.toml missing expected name = \"snapog\""
            exit 1
          fi
          if ! grep -q 'binding = "DB"' wrangler.toml; then
            echo "::error::wrangler.toml missing D1 binding named DB"
            exit 1
          fi
          if ! grep -q 'binding = "OG_CACHE"' wrangler.toml; then
            echo "::error::wrangler.toml missing R2 binding named OG_CACHE"
            exit 1
          fi
